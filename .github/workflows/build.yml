name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NCbor.sln

      - name: Build
        run: dotnet build NCbor.sln --no-restore --configuration Release

      # Runs every test project in the solution (NCbor.Tests + NCbor.Generator.Tests). Plain
      # `--logger trx` gives each project its own .trx file instead of overwriting one name.
      - name: Test
        run: dotnet test NCbor.sln --no-build --configuration Release --logger trx --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/*.trx
